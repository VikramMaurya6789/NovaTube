name: Build NovaTube APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME/ANDROID_SDK_ROOT already set) — just add packages.
      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;30.0.3"

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :smarttubetv:assembleNovatubeDebug --console=plain
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novatube-apk
          path: smarttubetv/build/outputs/apk/novatube/debug/*.apk
